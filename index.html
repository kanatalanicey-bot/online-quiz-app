
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-container">
    <header>
      <p class="tag">LEARN • PLAY • GROW</p>
      <h1>Online Quiz</h1>
      <p class="subtitle">Test your knowledge and challenge yourself!</p>
    </header>

    <section id="quiz-screen">
      <div class="quiz-info">
        <span id="question-number">Question 1 of 5</span>
        <span id="score">Score: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar"></div>
      </div>

      <h2 id="question">Question will appear here</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>

      <button id="next-btn" disabled>Next Question →</button>
    </section>

    <section id="result-screen" hidden>
      <div class="result-icon">🏆</div>
      <h2>Quiz Completed!</h2>
      <p id="result-message"></p>
      <p id="final-score"></p>
      <button id="restart-btn">Try Again ↻</button>
    </section>

    <footer>Made with ❤️ by a CSE student</footer>
  </main>
</body>
</html>

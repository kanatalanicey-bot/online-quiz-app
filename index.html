
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>🧠 Online Quiz App</h1>
    <p class="subtitle">Test your knowledge and beat the clock!</p>

    <section id="quiz-screen">
      <label for="player-name">Your name</label>
      <input
        type="text"
        id="player-name"
        placeholder="Enter your name"
        maxlength="20"
      >

      <div class="quiz-info">
        <span id="question-number">Question 1 of 20</span>
        <span id="timer">Time Left: 2:00</span>
      </div>

      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>

      <h2 id="question">Loading question...</h2>
      <div id="answers"></div>

      <p id="score">Score: 0</p>
    </section>

    <section id="result-screen" style="display: none;">
      <h2>🎉 Quiz Completed!</h2>
      <p>Your score:</p>
      <h2 id="final-score">0 / 20</h2>
      <p id="result-message"></p>
      <button id="restart-btn" type="button">Play Again 🔄</button>
    </section>

    <section class="leaderboard">
      <h2>🏆 Top 5 Leaderboard</h2>
      <ol id="leaderboard-list">
        <li>Complete a quiz to appear here!</li>
      </ol>
    </section>
  </main>
</body>
</html>
